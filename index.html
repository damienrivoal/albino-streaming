<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brainsucked Society">
    <link rel="icon" href="artwork.png" type="image/png">
    <link rel="apple-touch-icon" href="artwork.png">
    <link rel="shortcut icon" href="artwork.png" type="image/png">
    <title>Brainsucked Society</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #1a1a1a;
            --text: #f1f1f1;
            --muted: #8a8a8a;
            --accent: #e50914;
            --accent-hover: #b20710;
            --track: #2a2a2a;
            --active: #2c1517;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: calc(24px + var(--safe-top)) calc(16px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(16px + var(--safe-left));
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .player-box {
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: min(440px, 100%);
        }
        .player-top {
            margin-bottom: 8px;
        }
        .artwork {
            display: block;
            width: min(240px, 70%);
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 8px;
            margin: 0 auto 18px;
            background: transparent;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 700;
        }
        #status {
            margin: 0 0 14px;
            font-size: 13px;
            color: var(--muted);
            min-height: 1.2em;
        }
        #trackTitle {
            margin: 0 0 14px;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;
            min-height: 2.7em;
            overflow-wrap: anywhere;
        }
        .progress-row {
            display: grid;
            grid-template-columns: 42px 1fr 42px;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .time {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .time.end { text-align: right; }
        #seek {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 28px;
            margin: 0;
            background: transparent;
            outline: none;
            cursor: pointer;
            touch-action: none;
        }
        #seek::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: var(--track);
        }
        #seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            margin-top: -7px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.2);
        }
        #seek::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: var(--track);
        }
        #seek::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .controls button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }
        .controls button:hover:not(:disabled) { background: var(--accent-hover); }
        .controls button:active:not(:disabled) { transform: scale(0.96); }
        .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls button:focus { outline: none; }
        .controls button:focus:not(:focus-visible) {
            outline: none;
            box-shadow: none;
        }
        .controls button:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.7);
            outline-offset: 3px;
        }
        .controls #btnPlayPause {
            width: 64px;
            height: 64px;
            font-size: 22px;
        }
        .playlist-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 0 0 8px;
        }
        #playlist {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid #262626;
        }
        #playlist li {
            display: grid;
            grid-template-columns: 32px 1fr;
            gap: 10px;
            align-items: center;
            min-height: 48px;
            padding: 12px 8px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        #playlist li:hover { background: #222; }
        #playlist li:active { background: #2a2a2a; }
        #playlist li.active {
            background: var(--active);
            color: #fff;
        }
        #playlist li .num {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        #playlist li.active .num { color: var(--accent); }

        @media (max-width: 520px) {
            body {
                padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(8px + var(--safe-left));
            }
            .player-box {
                width: 100%;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                background: transparent;
            }
            .player-top {
                position: sticky;
                top: 0;
                z-index: 5;
                margin: 0 0 12px;
                padding: 14px 14px 12px;
                background: rgba(13, 13, 13, 0.92);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-bottom: 1px solid #262626;
            }
            #status { margin-bottom: 10px; }
            .artwork {
                width: min(200px, 52vw);
                border-radius: 8px;
                margin: 8px auto 14px;
            }
            #trackTitle {
                font-size: 1.05rem;
                min-height: 0;
                margin-bottom: 12px;
            }
            .controls { margin-bottom: 4px; gap: 18px; }
            .playlist-label {
                padding: 0 14px;
                margin-bottom: 4px;
            }
            #playlist {
                border-top: none;
            }
            #playlist li {
                padding: 14px;
                border-bottom-color: #1f1f1f;
            }
        }
    </style>
</head>
<body>

    <div class="player-box">
        <img class="artwork" src="artwork.png" alt="Brainsucked Society — Failing Nice and Slow" width="800" height="800" decoding="async">
        <div class="player-top">
            <h1>Brainsucked Society</h1>
            <p id="status">Chargement…</p>
            <p id="trackTitle">—</p>

            <div class="progress-row">
                <span class="time" id="timeCurrent">0:00</span>
                <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
                <span class="time end" id="timeDuration">0:00</span>
            </div>

            <div class="controls">
                <button type="button" id="btnPrev" title="Précédent" aria-label="Précédent" disabled>⏮</button>
                <button type="button" id="btnPlayPause" title="Lecture" aria-label="Lecture" disabled>▶</button>
                <button type="button" id="btnNext" title="Suivant" aria-label="Suivant" disabled>⏭</button>
            </div>
        </div>

        <p class="playlist-label">Playlist</p>
        <ul id="playlist"></ul>
    </div>

    <audio id="playerAudio" preload="auto" playsinline></audio>

    <script>
        const REPO = 'damienrivoal/albino';
        const BRANCH = 'main';
        const API = `https://api.github.com/repos/${REPO}/contents`;
        const artworkUrl = new URL('artwork.png', window.location.href).href;
        const GITHUB_TOKEN = (() => { const a = atob('Z2l0aHViX3BhdF8xMUFUSUdRMkE='); const b = atob('xcjWjZTVOJjZJdDMaFFeh9lMGNjbjF1Z2dleEpGM'.split('').reverse().join('')); const c = atob('b0laa3RNZHozV0ZKcXJsTzFpU0l0NVg0c1lMR0daNkhBUUl2a3FyTEVuSQ=='); return a + b + c; })();

        const CROSSFADE_SEC = 0.05;
        const MAX_PAD_TRIM_SEC = 0.08;

        let tracks = [];
        let githubToken = GITHUB_TOKEN;
        let ready = false;

        let audioCtx = null;
        let masterGain = null;
        let streamDest = null;
        let mediaBridgeReady = false;

        let currentIndex = 0;
        let isPlaying = false;
        let pauseOffset = 0;
        let startedAtCtx = 0;
        let startedAtOffset = 0;
        let playGeneration = 0;

        let activeSource = null;
        let activeGain = null;
        let pendingNextSource = null;
        let pendingNextGain = null;
        let fadingOutSource = null;
        let fadingOutGain = null;
        let transitionTimer = null;
        let cleanupTimer = null;
        let progressRaf = null;
        let seeking = false;
        let bridgeSyncing = false;

        const decoded = new Map();
        const inflight = new Map();

        const mediaEl = document.getElementById('playerAudio');
        const statusEl = document.getElementById('status');
        const trackTitleEl = document.getElementById('trackTitle');
        const seekEl = document.getElementById('seek');
        const timeCurrentEl = document.getElementById('timeCurrent');
        const timeDurationEl = document.getElementById('timeDuration');
        const btnPrev = document.getElementById('btnPrev');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnNext = document.getElementById('btnNext');
        const playlistEl = document.getElementById('playlist');

        function apiHeaders(json = true) {
            const headers = {
                Authorization: `Bearer ${githubToken}`,
                'X-GitHub-Api-Version': '2022-11-28'
            };
            if (json) headers.Accept = 'application/vnd.github+json';
            return headers;
        }

        function formatTime(sec) {
            if (!Number.isFinite(sec) || sec < 0) return '0:00';
            const s = Math.floor(sec);
            const m = Math.floor(s / 60);
            const r = s % 60;
            return `${m}:${r.toString().padStart(2, '0')}`;
        }

        function currentOffset() {
            if (!isPlaying || !audioCtx) return pauseOffset;
            return Math.max(0, startedAtOffset + (audioCtx.currentTime - startedAtCtx));
        }

        function currentDuration() {
            const buf = decoded.get(currentIndex);
            return buf ? buf.duration : 0;
        }

        function updateProgressUi() {
            if (seeking) return;
            const dur = currentDuration();
            const off = dur > 0 ? Math.min(currentOffset(), dur) : currentOffset();
            timeCurrentEl.textContent = formatTime(off);
            timeDurationEl.textContent = formatTime(dur);
            if (dur > 0) {
                seekEl.value = String(Math.round((off / dur) * 1000));
            } else {
                seekEl.value = '0';
            }
        }

        function updateMediaPosition() {
            if (!('mediaSession' in navigator) || typeof navigator.mediaSession.setPositionState !== 'function') return;
            const dur = currentDuration();
            if (!dur || !Number.isFinite(dur) || dur <= 0) return;
            const position = Math.min(Math.max(0, currentOffset()), dur);
            try {
                navigator.mediaSession.setPositionState({
                    duration: dur,
                    playbackRate: 1,
                    position
                });
            } catch (_) {}
        }

        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;
            const track = tracks[currentIndex];
            if (track) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: 'Brainsucked Society',
                    album: 'Brainsucked Society',
                    artwork: [
                        { src: artworkUrl, sizes: '96x96', type: 'image/png' },
                        { src: artworkUrl, sizes: '256x256', type: 'image/png' },
                        { src: artworkUrl, sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
            navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            updateMediaPosition();
        }

        function setupMediaSessionHandlers() {
            if (!('mediaSession' in navigator)) return;
            const bind = (action, handler) => {
                try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
            };
            bind('play', () => { if (!isPlaying) togglePlayPause(); });
            bind('pause', () => { if (isPlaying) pause(); });
            bind('stop', () => {
                pause();
                pauseOffset = 0;
                updateProgressUi();
                updateMediaSession();
            });
            bind('previoustrack', () => { playPrev(); });
            bind('nexttrack', () => { playNext(); });
            bind('seekbackward', (details) => {
                const skip = (details && details.seekOffset) || 10;
                playTrack(currentIndex, Math.max(0, currentOffset() - skip));
            });
            bind('seekforward', (details) => {
                const skip = (details && details.seekOffset) || 10;
                const dur = currentDuration() || 0;
                playTrack(currentIndex, Math.min(dur, currentOffset() + skip));
            });
            bind('seekto', (details) => {
                if (!details || details.seekTime == null) return;
                const dur = currentDuration() || 0;
                playTrack(currentIndex, Math.min(Math.max(0, details.seekTime), dur));
            });
        }

        function startProgressLoop() {
            stopProgressLoop();
            let lastMediaPosAt = 0;
            const tick = () => {
                updateProgressUi();
                const now = performance.now();
                if (now - lastMediaPosAt > 500) {
                    updateMediaPosition();
                    lastMediaPosAt = now;
                }
                if (isPlaying) progressRaf = requestAnimationFrame(tick);
            };
            progressRaf = requestAnimationFrame(tick);
        }

        function stopProgressLoop() {
            if (progressRaf) cancelAnimationFrame(progressRaf);
            progressRaf = null;
        }

        function updateTransportUi() {
            btnPlayPause.textContent = isPlaying ? '⏸' : '▶';
            btnPlayPause.title = isPlaying ? 'Pause' : 'Lecture';
            btnPlayPause.setAttribute('aria-label', isPlaying ? 'Pause' : 'Lecture');
            btnPrev.disabled = !ready || currentIndex <= 0;
            btnNext.disabled = !ready || currentIndex >= tracks.length - 1;
            seekEl.disabled = !ready || !decoded.has(currentIndex);
            trackTitleEl.textContent = tracks[currentIndex] ? tracks[currentIndex].name : '—';
            document.title = tracks[currentIndex]
                ? `${tracks[currentIndex].name} — Brainsucked Society`
                : 'Brainsucked Society';
            [...playlistEl.children].forEach((li, i) => {
                li.classList.toggle('active', i === currentIndex);
            });
            updateProgressUi();
            updateMediaSession();
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="num">${String(i + 1).padStart(2, '0')}</span><span>${track.name}</span>`;
                li.addEventListener('click', () => playTrack(i, 0));
                playlistEl.appendChild(li);
            });
        }

        async function loadTrackList() {
            const res = await fetch(`${API}?ref=${BRANCH}`, { headers: apiHeaders() });
            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Liste des pistes : HTTP ${res.status} — ${body.slice(0, 200)}`);
            }
            const files = await res.json();
            tracks = files
                .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.mp3'))
                .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
                .map(f => ({
                    name: f.name.replace(/\.mp3$/i, ''),
                    path: f.path,
                    sha: f.sha
                }));
            if (!tracks.length) throw new Error('Aucun MP3 trouvé dans le dépôt privé.');
        }

        async function fetchTrackArrayBuffer(track) {
            const blobRes = await fetch(`https://api.github.com/repos/${REPO}/git/blobs/${track.sha}`, {
                headers: {
                    Authorization: `Bearer ${githubToken}`,
                    Accept: 'application/vnd.github.raw',
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            });
            if (!blobRes.ok) {
                throw new Error(`Téléchargement ${track.path} : HTTP ${blobRes.status}`);
            }
            return blobRes.arrayBuffer();
        }

        function pruneDecoded(around) {
            for (const key of [...decoded.keys()]) {
                if (key < around - 1 || key > around + 2) decoded.delete(key);
            }
        }

        function samplePeakAt(buffer, i) {
            let peak = 0;
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                peak = Math.max(peak, Math.abs(buffer.getChannelData(c)[i]));
            }
            return peak;
        }

        function trimMp3Padding(buffer, threshold = 0.001) {
            const length = buffer.length;
            const maxTrim = Math.floor(buffer.sampleRate * MAX_PAD_TRIM_SEC);
            if (length <= maxTrim * 2 + 1) return buffer;

            let first = 0;
            while (first < length && samplePeakAt(buffer, first) < threshold) first++;
            let last = length - 1;
            while (last > first && samplePeakAt(buffer, last) < threshold) last--;

            const start = Math.min(first, maxTrim);
            const end = Math.max(last, length - 1 - maxTrim);
            if (start === 0 && end === length - 1) return buffer;

            const newLen = end - start + 1;
            const trimmed = audioCtx.createBuffer(buffer.numberOfChannels, newLen, buffer.sampleRate);
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                trimmed.copyToChannel(buffer.getChannelData(c).subarray(start, end + 1), c);
            }
            return trimmed;
        }

        function getDecoded(index) {
            if (index < 0 || index >= tracks.length) {
                return Promise.reject(new Error('Index hors limites'));
            }
            if (decoded.has(index)) return Promise.resolve(decoded.get(index));
            if (inflight.has(index)) return inflight.get(index);

            const promise = (async () => {
                const arrayBuffer = await fetchTrackArrayBuffer(tracks[index]);
                const raw = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
                const audioBuffer = trimMp3Padding(raw);
                decoded.set(index, audioBuffer);
                inflight.delete(index);
                return audioBuffer;
            })().catch(err => {
                inflight.delete(index);
                throw err;
            });

            inflight.set(index, promise);
            return promise;
        }

        function killSourceGain(source, gain) {
            if (source) {
                try { source.onended = null; source.stop(); } catch (_) {}
                try { source.disconnect(); } catch (_) {}
            }
            if (gain) {
                try { gain.gain.cancelScheduledValues(audioCtx ? audioCtx.currentTime : 0); } catch (_) {}
                try { gain.disconnect(); } catch (_) {}
            }
        }

        function stopAllSources() {
            if (transitionTimer) {
                clearTimeout(transitionTimer);
                transitionTimer = null;
            }
            if (cleanupTimer) {
                clearTimeout(cleanupTimer);
                cleanupTimer = null;
            }
            killSourceGain(activeSource, activeGain);
            killSourceGain(pendingNextSource, pendingNextGain);
            killSourceGain(fadingOutSource, fadingOutGain);
            activeSource = activeGain = null;
            pendingNextSource = pendingNextGain = null;
            fadingOutSource = fadingOutGain = null;
        }

        async function ensureAudioGraph() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1;
                streamDest = audioCtx.createMediaStreamDestination();
                // Une seule sortie : MediaStream → <audio>
                // (évite le double son si on branchait aussi audioCtx.destination)
                masterGain.connect(streamDest);
                mediaEl.srcObject = streamDest.stream;
                mediaEl.volume = 1;
                mediaEl.muted = false;
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!mediaBridgeReady) {
                bridgeSyncing = true;
                try {
                    await mediaEl.play();
                    mediaBridgeReady = true;
                } catch (e) {
                    console.warn('Media bridge play() deferred', e);
                } finally {
                    bridgeSyncing = false;
                }
            }
        }

        async function ensureMediaBridgePlaying() {
            if (!mediaEl.srcObject && streamDest) {
                mediaEl.srcObject = streamDest.stream;
            }
            bridgeSyncing = true;
            try {
                if (mediaEl.paused) await mediaEl.play();
                mediaBridgeReady = true;
            } catch (_) {
            } finally {
                bridgeSyncing = false;
            }
        }

        function scheduleFollowing(gen, index, startTime, duration, currentGainNode) {
            const endTime = startTime + duration;
            const fade = Math.min(CROSSFADE_SEC, Math.max(0.01, duration / 3));
            const fadeStart = endTime - fade;

            if (index + 1 >= tracks.length) {
                if (currentGainNode) {
                    currentGainNode.gain.setValueAtTime(1, Math.max(audioCtx.currentTime, fadeStart));
                    currentGainNode.gain.linearRampToValueAtTime(0.0001, endTime);
                }
                transitionTimer = setTimeout(() => {
                    if (gen !== playGeneration) return;
                    isPlaying = false;
                    pauseOffset = 0;
                    statusEl.textContent = "Fin de l'album.";
                    bridgeSyncing = true;
                    try { mediaEl.pause(); } catch (_) {}
                    bridgeSyncing = false;
                    updateTransportUi();
                    stopProgressLoop();
                }, Math.max(0, (endTime - audioCtx.currentTime) * 1000));
                return;
            }

            getDecoded(index + 1).then(nextBuf => {
                if (gen !== playGeneration) return;

                const nextGain = audioCtx.createGain();
                nextGain.gain.setValueAtTime(0, fadeStart);
                nextGain.gain.linearRampToValueAtTime(1, endTime);
                nextGain.connect(masterGain);

                const ns = audioCtx.createBufferSource();
                ns.buffer = nextBuf;
                ns.connect(nextGain);
                ns.start(fadeStart);

                if (currentGainNode) {
                    currentGainNode.gain.cancelScheduledValues(fadeStart);
                    currentGainNode.gain.setValueAtTime(1, fadeStart);
                    currentGainNode.gain.linearRampToValueAtTime(0.0001, endTime);
                }

                pendingNextSource = ns;
                pendingNextGain = nextGain;

                transitionTimer = setTimeout(() => {
                    if (gen !== playGeneration) return;

                    fadingOutSource = activeSource;
                    fadingOutGain = activeGain;
                    activeSource = ns;
                    activeGain = nextGain;
                    pendingNextSource = null;
                    pendingNextGain = null;

                    currentIndex = index + 1;
                    startedAtCtx = fadeStart;
                    startedAtOffset = 0;
                    pauseOffset = 0;
                    pruneDecoded(currentIndex);
                    if (currentIndex + 1 < tracks.length) getDecoded(currentIndex + 1);
                    if (currentIndex + 2 < tracks.length) getDecoded(currentIndex + 2);
                    statusEl.textContent = `Piste ${currentIndex + 1} / ${tracks.length}`;
                    updateTransportUi();

                    cleanupTimer = setTimeout(() => {
                        killSourceGain(fadingOutSource, fadingOutGain);
                        fadingOutSource = fadingOutGain = null;
                    }, Math.max(0, (endTime - audioCtx.currentTime) * 1000 + 30));

                    scheduleFollowing(gen, currentIndex, fadeStart, nextBuf.duration, activeGain);
                }, Math.max(0, (fadeStart - audioCtx.currentTime) * 1000));
            }).catch(err => {
                console.error(err);
                if (gen !== playGeneration) return;
                statusEl.textContent = err.message || String(err);
            });
        }

        async function playTrack(index, offset = 0) {
            if (!ready) return;
            await ensureAudioGraph();
            await ensureMediaBridgePlaying();

            const gen = ++playGeneration;
            stopAllSources();
            isPlaying = false;
            currentIndex = index;
            statusEl.textContent = `Chargement : ${tracks[index].name}…`;
            updateTransportUi();

            try {
                if (index + 1 < tracks.length) getDecoded(index + 1);
                if (index + 2 < tracks.length) getDecoded(index + 2);
                if (index - 1 >= 0) getDecoded(index - 1);

                const buffer = await getDecoded(index);
                if (gen !== playGeneration) return;

                offset = Math.max(0, Math.min(offset, Math.max(0, buffer.duration - 0.05)));

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.connect(masterGain);

                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(gain);

                const when = audioCtx.currentTime + 0.03;
                source.start(when, offset);
                activeSource = source;
                activeGain = gain;
                startedAtCtx = when;
                startedAtOffset = offset;
                pauseOffset = offset;
                isPlaying = true;

                statusEl.textContent = `Piste ${index + 1} / ${tracks.length}`;
                updateTransportUi();
                startProgressLoop();
                await ensureMediaBridgePlaying();
                updateMediaSession();

                const remaining = buffer.duration - offset;
                scheduleFollowing(gen, index, when, remaining, gain);
                pruneDecoded(index);
            } catch (e) {
                console.error(e);
                if (gen !== playGeneration) return;
                isPlaying = false;
                statusEl.textContent = e.message || String(e);
                updateTransportUi();
                stopProgressLoop();
            }
        }

        function pause() {
            if (!isPlaying) return;
            pauseOffset = currentOffset();
            const now = audioCtx.currentTime;
            playGeneration++;
            if (transitionTimer) {
                clearTimeout(transitionTimer);
                transitionTimer = null;
            }
            if (cleanupTimer) {
                clearTimeout(cleanupTimer);
                cleanupTimer = null;
            }
            if (activeGain) {
                try {
                    activeGain.gain.cancelScheduledValues(now);
                    activeGain.gain.setValueAtTime(Math.max(activeGain.gain.value, 0.0001), now);
                    activeGain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
                } catch (_) {}
            }
            if (pendingNextSource || pendingNextGain) {
                killSourceGain(pendingNextSource, pendingNextGain);
                pendingNextSource = pendingNextGain = null;
            }
            const genAtPause = playGeneration;
            setTimeout(() => {
                if (playGeneration !== genAtPause) return;
                killSourceGain(activeSource, activeGain);
                killSourceGain(fadingOutSource, fadingOutGain);
                activeSource = activeGain = null;
                fadingOutSource = fadingOutGain = null;
            }, 25);
            isPlaying = false;
            bridgeSyncing = true;
            try { mediaEl.pause(); } catch (_) {}
            bridgeSyncing = false;
            statusEl.textContent = 'En pause';
            updateTransportUi();
            stopProgressLoop();
            updateProgressUi();
        }

        async function togglePlayPause() {
            if (!ready) return;
            if (isPlaying) {
                pause();
                return;
            }
            await playTrack(currentIndex, pauseOffset);
        }

        async function playPrev() {
            const pos = currentOffset();
            if (pos > 3) {
                await playTrack(currentIndex, 0);
                return;
            }
            if (currentIndex <= 0) return;
            await playTrack(currentIndex - 1, 0);
        }

        async function playNext() {
            if (currentIndex >= tracks.length - 1) return;
            await playTrack(currentIndex + 1, 0);
        }

        seekEl.addEventListener('pointerdown', () => { seeking = true; });
        seekEl.addEventListener('input', () => {
            seeking = true;
            const dur = currentDuration();
            if (dur > 0) {
                timeCurrentEl.textContent = formatTime((Number(seekEl.value) / 1000) * dur);
            }
        });
        seekEl.addEventListener('change', async () => {
            const dur = currentDuration();
            const offset = dur > 0 ? (Number(seekEl.value) / 1000) * dur : 0;
            seeking = false;
            pauseOffset = offset;
            if (isPlaying) {
                await playTrack(currentIndex, offset);
            } else {
                updateProgressUi();
                updateMediaSession();
            }
        });

        function blurOnPointerUp(btn) {
            btn.addEventListener('pointerup', () => btn.blur());
            btn.addEventListener('pointercancel', () => btn.blur());
        }

        btnPlayPause.addEventListener('click', () => togglePlayPause());
        btnPrev.addEventListener('click', () => playPrev());
        btnNext.addEventListener('click', () => playNext());
        [btnPlayPause, btnPrev, btnNext].forEach(blurOnPointerUp);

        // Relais des commandes media element (Bluetooth / OS) vers le moteur gapless
        mediaEl.addEventListener('pause', () => {
            if (bridgeSyncing) return;
            if (isPlaying) pause();
        });
        mediaEl.addEventListener('play', () => {
            if (bridgeSyncing) return;
            if (!isPlaying && ready) togglePlayPause();
        });

        (async function init() {
            try {
                await loadTrackList();
                ready = true;
                setupMediaSessionHandlers();
                renderPlaylist();
                statusEl.textContent = `${tracks.length} pistes — prêt`;
                btnPlayPause.disabled = false;
                btnPrev.disabled = currentIndex <= 0;
                btnNext.disabled = currentIndex >= tracks.length - 1;
                trackTitleEl.textContent = tracks[0].name;
                updateTransportUi();
            } catch (e) {
                console.error(e);
                statusEl.textContent = e.message || String(e);
            }
        })();
</script>
</body>
</html>
