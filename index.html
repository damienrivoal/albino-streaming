<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brainsucked Society">
    <link rel="icon" href="artwork.png" type="image/png">
    <link rel="apple-touch-icon" href="artwork.png">
    <link rel="shortcut icon" href="artwork.png" type="image/png">
    <title>Brainsucked Society</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #1a1a1a;
            --text: #f1f1f1;
            --muted: #8a8a8a;
            --accent: #e50914;
            --accent-hover: #b20710;
            --track: #2a2a2a;
            --active: #2c1517;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: calc(24px + var(--safe-top)) calc(16px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(16px + var(--safe-left));
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .player-box {
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: min(440px, 100%);
        }
        .player-top {
            margin-bottom: 8px;
        }
        .artwork {
            display: block;
            width: min(240px, 70%);
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 8px;
            margin: 0 auto 18px;
            background: transparent;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 700;
        }
        #status {
            margin: 0 0 14px;
            font-size: 13px;
            color: var(--muted);
            min-height: 1.2em;
        }
        #trackTitle {
            margin: 0 0 14px;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;
            min-height: 2.7em;
            overflow-wrap: anywhere;
        }
        .progress-row {
            display: grid;
            grid-template-columns: 42px 1fr 42px;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .time {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .time.end { text-align: right; }
        #seek {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 28px;
            margin: 0;
            background: transparent;
            outline: none;
            cursor: pointer;
            touch-action: none;
        }
        #seek::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: var(--track);
        }
        #seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            margin-top: -7px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.2);
        }
        #seek::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: var(--track);
        }
        #seek::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .controls button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }
        .controls button:hover:not(:disabled) { background: var(--accent-hover); }
        .controls button:active:not(:disabled) { transform: scale(0.96); }
        .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls button,
        .controls button:focus,
        .controls button:focus-visible,
        .controls button:active {
            outline: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        /* Anneau de focus clavier uniquement (pas tactile) */
        @media (hover: hover) and (pointer: fine) {
            .controls button:focus-visible {
                outline: 2px solid rgba(255, 255, 255, 0.7) !important;
                outline-offset: 3px;
            }
        }
        .controls button svg {
            width: 22px;
            height: 22px;
            display: block;
            fill: currentColor;
            pointer-events: none;
        }
        .controls #btnPlayPause {
            width: 64px;
            height: 64px;
        }
        .controls #btnPlayPause svg {
            width: 28px;
            height: 28px;
        }
        .playlist-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 0 0 8px;
        }
        #playlist {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid #262626;
        }
        #playlist li {
            display: grid;
            grid-template-columns: 32px 1fr;
            gap: 10px;
            align-items: center;
            min-height: 48px;
            padding: 12px 8px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        #playlist li:hover { background: #222; }
        #playlist li:active { background: #2a2a2a; }
        #playlist li.active {
            background: var(--active);
            color: #fff;
        }
        #playlist li .num {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        #playlist li.active .num { color: var(--accent); }

        @media (max-width: 520px) {
            body {
                padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(8px + var(--safe-left));
            }
            .player-box {
                width: 100%;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                background: transparent;
            }
            .player-top {
                position: sticky;
                top: 0;
                z-index: 5;
                margin: 0 0 12px;
                padding: 14px 14px 12px;
                background: rgba(13, 13, 13, 0.92);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-bottom: 1px solid #262626;
            }
            #status { margin-bottom: 10px; }
            .artwork {
                width: min(200px, 52vw);
                border-radius: 8px;
                margin: 8px auto 14px;
            }
            #trackTitle {
                font-size: 1.05rem;
                min-height: 0;
                margin-bottom: 12px;
            }
            .controls { margin-bottom: 4px; gap: 18px; }
            .playlist-label {
                padding: 0 14px;
                margin-bottom: 4px;
            }
            #playlist {
                border-top: none;
            }
            #playlist li {
                padding: 14px;
                border-bottom-color: #1f1f1f;
            }
        }
    </style>
</head>
<body>

    <div class="player-box">
        <img class="artwork" src="artwork.png" alt="Brainsucked Society — Failing Nice and Slow" width="800" height="800" decoding="async">
        <div class="player-top">
            <h1>Brainsucked Society</h1>
            <p id="status">Chargement…</p>
            <p id="trackTitle">—</p>

            <div class="progress-row">
                <span class="time" id="timeCurrent">0:00</span>
                <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
                <span class="time end" id="timeDuration">0:00</span>
            </div>

            <div class="controls">
                <button type="button" id="btnPrev" title="Précédent" aria-label="Précédent" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2.5v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button type="button" id="btnPlayPause" title="Lecture" aria-label="Lecture" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
                </button>
                <button type="button" id="btnNext" title="Suivant" aria-label="Suivant" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 6H18v12h-2.5V6zM6 18l8.5-6L6 6v12z"/></svg>
                </button>
            </div>
        </div>

        <p class="playlist-label">Playlist</p>
        <ul id="playlist"></ul>
    </div>

    <audio id="playerAudioA" preload="auto" playsinline></audio>
    <audio id="playerAudioB" preload="auto" playsinline></audio>

    <script>
        const REPO = 'damienrivoal/albino';
        const BRANCH = 'main';
        const API = `https://api.github.com/repos/${REPO}/contents`;
        const artworkUrl = new URL('artwork.png', window.location.href).href;
        const GITHUB_TOKEN = (() => { const a = atob('Z2l0aHViX3BhdF8xMUFUSUdRMkE='); const b = atob('xcjWjZTVOJjZJdDMaFFeh9lMGNjbjF1Z2dleEpGM'.split('').reverse().join('')); const c = atob('b0laa3RNZHozV0ZKcXJsTzFpU0l0NVg0c1lMR0daNkhBUUl2a3FyTEVuSQ=='); return a + b + c; })();

        // Mobile / tablette : <audio> (bandeau média). Desktop : Web Audio gapless réel.
        const USE_HTML_ENGINE = (() => {
            const ua = navigator.userAgent || '';
            if (/Android|iPhone|iPad|iPod/i.test(ua)) return true;
            if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
            return false;
        })();

        // Mobile HTML : anticiper + léger overlap. Desktop Web Audio garde CROSSFADE_SEC.
        const HANDOFF_SEC = 0.28;
        const HTML_CROSSFADE_SEC = 0.2;
        const CROSSFADE_SEC = 0.05;
        const MAX_PAD_TRIM_SEC = 0.08;

        let tracks = [];
        let githubToken = GITHUB_TOKEN;
        let ready = false;

        let currentIndex = 0;
        let isPlaying = false;
        let pauseOffset = 0;
        let playGeneration = 0;
        let progressRaf = null;
        let seeking = false;

        // --- HTML engine state ---
        let handoffArmed = false;
        let syncing = false;
        let crossfadeRaf = null;
        const blobUrls = new Map();
        const inflightBlobs = new Map();
        const audioA = document.getElementById('playerAudioA');
        const audioB = document.getElementById('playerAudioB');
        let active = audioA;
        let standby = audioB;

        // --- Web Audio engine state ---
        let audioCtx = null;
        let startedAtCtx = 0;
        let startedAtOffset = 0;
        let activeSource = null;
        let activeGain = null;
        let pendingNextSource = null;
        let pendingNextGain = null;
        let fadingOutSource = null;
        let fadingOutGain = null;
        let transitionTimer = null;
        let cleanupTimer = null;
        const decoded = new Map();
        const inflightDecoded = new Map();

        const statusEl = document.getElementById('status');
        const trackTitleEl = document.getElementById('trackTitle');
        const seekEl = document.getElementById('seek');
        const timeCurrentEl = document.getElementById('timeCurrent');
        const timeDurationEl = document.getElementById('timeDuration');
        const btnPrev = document.getElementById('btnPrev');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnNext = document.getElementById('btnNext');
        const playlistEl = document.getElementById('playlist');

        function apiHeaders(json = true) {
            const headers = {
                Authorization: `Bearer ${githubToken}`,
                'X-GitHub-Api-Version': '2022-11-28'
            };
            if (json) headers.Accept = 'application/vnd.github+json';
            return headers;
        }

        function formatTime(sec) {
            if (!Number.isFinite(sec) || sec < 0) return '0:00';
            const s = Math.floor(sec);
            const m = Math.floor(s / 60);
            const r = s % 60;
            return `${m}:${r.toString().padStart(2, '0')}`;
        }

        function currentOffset() {
            if (USE_HTML_ENGINE) {
                if (isPlaying && Number.isFinite(active.currentTime)) return active.currentTime;
                return pauseOffset;
            }
            if (!isPlaying || !audioCtx) return pauseOffset;
            return Math.max(0, startedAtOffset + (audioCtx.currentTime - startedAtCtx));
        }

        function currentDuration() {
            if (USE_HTML_ENGINE) {
                return (Number.isFinite(active.duration) && active.duration > 0) ? active.duration : 0;
            }
            const buf = decoded.get(currentIndex);
            return buf ? buf.duration : 0;
        }

        function updateProgressUi() {
            if (seeking) return;
            const dur = currentDuration();
            const off = dur > 0 ? Math.min(currentOffset(), dur) : currentOffset();
            timeCurrentEl.textContent = formatTime(off);
            timeDurationEl.textContent = formatTime(dur);
            seekEl.value = dur > 0 ? String(Math.round((off / dur) * 1000)) : '0';
        }

        function updateMediaPosition() {
            if (!('mediaSession' in navigator) || typeof navigator.mediaSession.setPositionState !== 'function') return;
            const dur = currentDuration();
            if (!dur || dur <= 0) return;
            try {
                navigator.mediaSession.setPositionState({
                    duration: dur,
                    playbackRate: 1,
                    position: Math.min(Math.max(0, currentOffset()), dur)
                });
            } catch (_) {}
        }

        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;
            const track = tracks[currentIndex];
            if (track) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: 'Brainsucked Society',
                    album: 'Brainsucked Society',
                    artwork: [
                        { src: artworkUrl, sizes: '96x96', type: 'image/png' },
                        { src: artworkUrl, sizes: '256x256', type: 'image/png' },
                        { src: artworkUrl, sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
            navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            updateMediaPosition();
        }

        function setupMediaSessionHandlers() {
            if (!('mediaSession' in navigator)) return;
            const bind = (action, handler) => {
                try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
            };
            bind('play', () => { if (!isPlaying) togglePlayPause(); });
            bind('pause', () => { if (isPlaying) pause(); });
            bind('stop', () => {
                pause();
                pauseOffset = 0;
                updateProgressUi();
                updateMediaSession();
            });
            bind('previoustrack', () => { playPrev(); });
            bind('nexttrack', () => { playNext(); });
            bind('seekbackward', (d) => {
                const skip = (d && d.seekOffset) || 10;
                seekTo(Math.max(0, currentOffset() - skip));
            });
            bind('seekforward', (d) => {
                const skip = (d && d.seekOffset) || 10;
                seekTo(Math.min(currentDuration() || 0, currentOffset() + skip));
            });
            bind('seekto', (d) => {
                if (!d || d.seekTime == null) return;
                seekTo(Math.min(Math.max(0, d.seekTime), currentDuration() || 0));
            });
        }

        function startProgressLoop() {
            stopProgressLoop();
            let lastMediaPosAt = 0;
            const tick = () => {
                updateProgressUi();
                if (USE_HTML_ENGINE) maybeHandoff();
                const now = performance.now();
                if (now - lastMediaPosAt > 500) {
                    updateMediaPosition();
                    lastMediaPosAt = now;
                }
                if (isPlaying) progressRaf = requestAnimationFrame(tick);
            };
            progressRaf = requestAnimationFrame(tick);
        }

        function stopProgressLoop() {
            if (progressRaf) cancelAnimationFrame(progressRaf);
            progressRaf = null;
        }

        function updateTransportUi() {
            btnPlayPause.innerHTML = isPlaying
                ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>'
                : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>';
            btnPlayPause.title = isPlaying ? 'Pause' : 'Lecture';
            btnPlayPause.setAttribute('aria-label', isPlaying ? 'Pause' : 'Lecture');
            btnPrev.disabled = !ready || currentIndex <= 0;
            btnNext.disabled = !ready || currentIndex >= tracks.length - 1;
            const canSeek = USE_HTML_ENGINE
                ? (Number.isFinite(active.duration) && active.duration > 0)
                : decoded.has(currentIndex);
            seekEl.disabled = !ready || !canSeek;
            trackTitleEl.textContent = tracks[currentIndex] ? tracks[currentIndex].name : '—';
            document.title = tracks[currentIndex]
                ? `${tracks[currentIndex].name} — Brainsucked Society`
                : 'Brainsucked Society';
            [...playlistEl.children].forEach((li, i) => li.classList.toggle('active', i === currentIndex));
            updateProgressUi();
            updateMediaSession();
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="num">${String(i + 1).padStart(2, '0')}</span><span>${track.name}</span>`;
                li.addEventListener('click', () => playTrack(i, 0));
                playlistEl.appendChild(li);
            });
        }

        async function loadTrackList() {
            const res = await fetch(`${API}?ref=${BRANCH}`, { headers: apiHeaders() });
            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Liste des pistes : HTTP ${res.status} — ${body.slice(0, 200)}`);
            }
            const files = await res.json();
            tracks = files
                .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.mp3'))
                .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
                .map(f => ({
                    name: f.name.replace(/\.mp3$/i, ''),
                    path: f.path,
                    sha: f.sha
                }));
            if (!tracks.length) throw new Error('Aucun MP3 trouvé dans le dépôt privé.');
        }

        async function fetchTrackArrayBuffer(track) {
            const blobRes = await fetch(`https://api.github.com/repos/${REPO}/git/blobs/${track.sha}`, {
                headers: {
                    Authorization: `Bearer ${githubToken}`,
                    Accept: 'application/vnd.github.raw',
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            });
            if (!blobRes.ok) throw new Error(`Téléchargement ${track.path} : HTTP ${blobRes.status}`);
            return blobRes.arrayBuffer();
        }

        // ===================== HTML engine (mobile) =====================

        function pruneBlobUrls(around) {
            for (const key of [...blobUrls.keys()]) {
                if (key < around - 1 || key > around + 2) {
                    URL.revokeObjectURL(blobUrls.get(key));
                    blobUrls.delete(key);
                }
            }
        }

        function getBlobUrl(index) {
            if (index < 0 || index >= tracks.length) return Promise.reject(new Error('Index hors limites'));
            if (blobUrls.has(index)) return Promise.resolve(blobUrls.get(index));
            if (inflightBlobs.has(index)) return inflightBlobs.get(index);
            const promise = (async () => {
                const arrayBuffer = await fetchTrackArrayBuffer(tracks[index]);
                const url = URL.createObjectURL(new Blob([arrayBuffer], { type: 'audio/mpeg' }));
                blobUrls.set(index, url);
                inflightBlobs.delete(index);
                pruneBlobUrls(index);
                return url;
            })().catch(err => { inflightBlobs.delete(index); throw err; });
            inflightBlobs.set(index, promise);
            return promise;
        }

        function waitMetadata(el) {
            if (Number.isFinite(el.duration) && el.duration > 0) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const ok = () => { cleanup(); resolve(); };
                const bad = () => { cleanup(); reject(new Error('Impossible de charger la piste audio.')); };
                const cleanup = () => {
                    el.removeEventListener('loadedmetadata', ok);
                    el.removeEventListener('error', bad);
                };
                el.addEventListener('loadedmetadata', ok);
                el.addEventListener('error', bad);
            });
        }

        async function prepareElement(el, index) {
            const url = await getBlobUrl(index);
            if (el.src !== url) {
                el.src = url;
                el.load();
            }
            await waitMetadata(el);
        }

        async function preloadStandby(nextIndex) {
            if (nextIndex < 0 || nextIndex >= tracks.length) return;
            try {
                await prepareElement(standby, nextIndex);
                standby.pause();
                standby.currentTime = 0;
            } catch (e) {
                console.warn('preload failed', e);
            }
        }

        function swapPlayers() {
            const tmp = active;
            active = standby;
            standby = tmp;
        }

        function setHtmlVolume(el, v) {
            try { el.volume = Math.max(0, Math.min(1, v)); } catch (_) {}
        }

        function resetHtmlVolumes() {
            setHtmlVolume(audioA, 1);
            setHtmlVolume(audioB, 1);
        }

        function cancelHtmlCrossfade() {
            if (crossfadeRaf != null) {
                cancelAnimationFrame(crossfadeRaf);
                crossfadeRaf = null;
            }
        }

        function crossfadeHtmlVolumes(fromEl, toEl, durationSec) {
            return new Promise((resolve) => {
                cancelHtmlCrossfade();
                const start = performance.now();
                const durMs = Math.max(32, durationSec * 1000);
                setHtmlVolume(fromEl, 1);
                setHtmlVolume(toEl, 0);
                const step = (now) => {
                    const t = Math.min(1, (now - start) / durMs);
                    // Equal-power : plus doux qu'un fade linéaire sur un court overlap.
                    const fadeOut = Math.cos(t * Math.PI / 2);
                    const fadeIn = Math.sin(t * Math.PI / 2);
                    setHtmlVolume(fromEl, fadeOut);
                    setHtmlVolume(toEl, fadeIn);
                    if (t < 1) {
                        crossfadeRaf = requestAnimationFrame(step);
                    } else {
                        crossfadeRaf = null;
                        resolve();
                    }
                };
                crossfadeRaf = requestAnimationFrame(step);
            });
        }

        function maybeHandoff() {
            if (!isPlaying || handoffArmed || seeking) return;
            const dur = active.duration;
            if (!Number.isFinite(dur) || dur <= 0) return;
            if (dur - active.currentTime > HANDOFF_SEC) return;
            if (currentIndex + 1 >= tracks.length) return;

            const nextIndex = currentIndex + 1;
            const gen = playGeneration;
            handoffArmed = true;

            (async () => {
                if (gen !== playGeneration) return;
                try {
                    if (!standby.src) await prepareElement(standby, nextIndex);
                    if (gen !== playGeneration) return;

                    standby.currentTime = 0;
                    setHtmlVolume(active, 1);
                    setHtmlVolume(standby, 0);
                    await standby.play();
                    if (gen !== playGeneration) {
                        try { standby.pause(); } catch (_) {}
                        resetHtmlVolumes();
                        handoffArmed = false;
                        return;
                    }

                    const fadeSec = Math.min(HTML_CROSSFADE_SEC, Math.max(0.05, dur - active.currentTime));
                    await crossfadeHtmlVolumes(active, standby, fadeSec);
                    if (gen !== playGeneration) {
                        try { standby.pause(); } catch (_) {}
                        resetHtmlVolumes();
                        handoffArmed = false;
                        return;
                    }

                    syncing = true;
                    try { active.pause(); } catch (_) {}
                    resetHtmlVolumes();
                    syncing = false;
                    swapPlayers();
                    currentIndex = nextIndex;
                    pauseOffset = 0;
                    handoffArmed = false;
                    statusEl.textContent = `Piste ${currentIndex + 1} / ${tracks.length}`;
                    updateTransportUi();
                    preloadStandby(currentIndex + 1);
                } catch (e) {
                    console.error(e);
                    cancelHtmlCrossfade();
                    resetHtmlVolumes();
                    handoffArmed = false;
                }
            })();
        }

        async function playTrackHtml(index, offset = 0) {
            const gen = ++playGeneration;
            cancelHtmlCrossfade();
            resetHtmlVolumes();
            handoffArmed = false;
            currentIndex = index;
            isPlaying = false;
            statusEl.textContent = `Chargement : ${tracks[index].name}…`;
            updateTransportUi();

            try {
                if (index + 1 < tracks.length) getBlobUrl(index + 1);
                if (index - 1 >= 0) getBlobUrl(index - 1);

                syncing = true;
                standby.pause();
                await prepareElement(active, index);
                if (gen !== playGeneration) return;

                offset = Math.max(0, Math.min(offset, Math.max(0, active.duration - 0.05)));
                active.currentTime = offset;
                pauseOffset = offset;
                setHtmlVolume(active, 1);
                await active.play();
                syncing = false;
                if (gen !== playGeneration) return;

                isPlaying = true;
                statusEl.textContent = `Piste ${index + 1} / ${tracks.length}`;
                updateTransportUi();
                startProgressLoop();
                preloadStandby(index + 1);
            } catch (e) {
                console.error(e);
                syncing = false;
                if (gen !== playGeneration) return;
                isPlaying = false;
                statusEl.textContent = e.message || String(e);
                updateTransportUi();
                stopProgressLoop();
            }
        }

        function pauseHtml() {
            if (!isPlaying) return;
            pauseOffset = currentOffset();
            playGeneration++;
            handoffArmed = false;
            cancelHtmlCrossfade();
            syncing = true;
            active.pause();
            standby.pause();
            resetHtmlVolumes();
            syncing = false;
            isPlaying = false;
            statusEl.textContent = 'En pause';
            updateTransportUi();
            stopProgressLoop();
            updateProgressUi();
        }

        // ===================== Web Audio engine (desktop gapless) =====================

        function pruneDecoded(around) {
            for (const key of [...decoded.keys()]) {
                if (key < around - 1 || key > around + 2) decoded.delete(key);
            }
        }

        function samplePeakAt(buffer, i) {
            let peak = 0;
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                peak = Math.max(peak, Math.abs(buffer.getChannelData(c)[i]));
            }
            return peak;
        }

        function trimMp3Padding(buffer, threshold = 0.001) {
            const length = buffer.length;
            const maxTrim = Math.floor(buffer.sampleRate * MAX_PAD_TRIM_SEC);
            if (length <= maxTrim * 2 + 1) return buffer;
            let first = 0;
            while (first < length && samplePeakAt(buffer, first) < threshold) first++;
            let last = length - 1;
            while (last > first && samplePeakAt(buffer, last) < threshold) last--;
            const start = Math.min(first, maxTrim);
            const end = Math.max(last, length - 1 - maxTrim);
            if (start === 0 && end === length - 1) return buffer;
            const newLen = end - start + 1;
            const trimmed = audioCtx.createBuffer(buffer.numberOfChannels, newLen, buffer.sampleRate);
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                trimmed.copyToChannel(buffer.getChannelData(c).subarray(start, end + 1), c);
            }
            return trimmed;
        }

        function getDecoded(index) {
            if (index < 0 || index >= tracks.length) return Promise.reject(new Error('Index hors limites'));
            if (decoded.has(index)) return Promise.resolve(decoded.get(index));
            if (inflightDecoded.has(index)) return inflightDecoded.get(index);
            const promise = (async () => {
                const arrayBuffer = await fetchTrackArrayBuffer(tracks[index]);
                const raw = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
                const audioBuffer = trimMp3Padding(raw);
                decoded.set(index, audioBuffer);
                inflightDecoded.delete(index);
                return audioBuffer;
            })().catch(err => { inflightDecoded.delete(index); throw err; });
            inflightDecoded.set(index, promise);
            return promise;
        }

        function killSourceGain(source, gain) {
            if (source) {
                try { source.onended = null; source.stop(); } catch (_) {}
                try { source.disconnect(); } catch (_) {}
            }
            if (gain) {
                try { gain.gain.cancelScheduledValues(audioCtx ? audioCtx.currentTime : 0); } catch (_) {}
                try { gain.disconnect(); } catch (_) {}
            }
        }

        function stopAllSources() {
            if (transitionTimer) { clearTimeout(transitionTimer); transitionTimer = null; }
            if (cleanupTimer) { clearTimeout(cleanupTimer); cleanupTimer = null; }
            killSourceGain(activeSource, activeGain);
            killSourceGain(pendingNextSource, pendingNextGain);
            killSourceGain(fadingOutSource, fadingOutGain);
            activeSource = activeGain = null;
            pendingNextSource = pendingNextGain = null;
            fadingOutSource = fadingOutGain = null;
        }

        async function ensureAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        function scheduleFollowing(gen, index, startTime, duration, currentGainNode) {
            const endTime = startTime + duration;
            const fade = Math.min(CROSSFADE_SEC, Math.max(0.01, duration / 3));
            const fadeStart = endTime - fade;

            if (index + 1 >= tracks.length) {
                if (currentGainNode) {
                    currentGainNode.gain.setValueAtTime(1, Math.max(audioCtx.currentTime, fadeStart));
                    currentGainNode.gain.linearRampToValueAtTime(0.0001, endTime);
                }
                transitionTimer = setTimeout(() => {
                    if (gen !== playGeneration) return;
                    isPlaying = false;
                    pauseOffset = 0;
                    statusEl.textContent = "Fin de l'album.";
                    updateTransportUi();
                    stopProgressLoop();
                }, Math.max(0, (endTime - audioCtx.currentTime) * 1000));
                return;
            }

            getDecoded(index + 1).then(nextBuf => {
                if (gen !== playGeneration) return;
                const nextGain = audioCtx.createGain();
                nextGain.gain.setValueAtTime(0, fadeStart);
                nextGain.gain.linearRampToValueAtTime(1, endTime);
                nextGain.connect(audioCtx.destination);
                const ns = audioCtx.createBufferSource();
                ns.buffer = nextBuf;
                ns.connect(nextGain);
                ns.start(fadeStart);
                if (currentGainNode) {
                    currentGainNode.gain.cancelScheduledValues(fadeStart);
                    currentGainNode.gain.setValueAtTime(1, fadeStart);
                    currentGainNode.gain.linearRampToValueAtTime(0.0001, endTime);
                }
                pendingNextSource = ns;
                pendingNextGain = nextGain;
                transitionTimer = setTimeout(() => {
                    if (gen !== playGeneration) return;
                    fadingOutSource = activeSource;
                    fadingOutGain = activeGain;
                    activeSource = ns;
                    activeGain = nextGain;
                    pendingNextSource = pendingNextGain = null;
                    currentIndex = index + 1;
                    startedAtCtx = fadeStart;
                    startedAtOffset = 0;
                    pauseOffset = 0;
                    pruneDecoded(currentIndex);
                    if (currentIndex + 1 < tracks.length) getDecoded(currentIndex + 1);
                    if (currentIndex + 2 < tracks.length) getDecoded(currentIndex + 2);
                    statusEl.textContent = `Piste ${currentIndex + 1} / ${tracks.length}`;
                    updateTransportUi();
                    cleanupTimer = setTimeout(() => {
                        killSourceGain(fadingOutSource, fadingOutGain);
                        fadingOutSource = fadingOutGain = null;
                    }, Math.max(0, (endTime - audioCtx.currentTime) * 1000 + 30));
                    scheduleFollowing(gen, currentIndex, fadeStart, nextBuf.duration, activeGain);
                }, Math.max(0, (fadeStart - audioCtx.currentTime) * 1000));
            }).catch(err => {
                console.error(err);
                if (gen !== playGeneration) return;
                statusEl.textContent = err.message || String(err);
            });
        }

        async function playTrackWebAudio(index, offset = 0) {
            await ensureAudioCtx();
            const gen = ++playGeneration;
            stopAllSources();
            isPlaying = false;
            currentIndex = index;
            statusEl.textContent = `Chargement : ${tracks[index].name}…`;
            updateTransportUi();

            try {
                if (index + 1 < tracks.length) getDecoded(index + 1);
                if (index + 2 < tracks.length) getDecoded(index + 2);
                if (index - 1 >= 0) getDecoded(index - 1);

                const buffer = await getDecoded(index);
                if (gen !== playGeneration) return;

                offset = Math.max(0, Math.min(offset, Math.max(0, buffer.duration - 0.05)));
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.connect(audioCtx.destination);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(gain);
                const when = audioCtx.currentTime + 0.03;
                source.start(when, offset);
                activeSource = source;
                activeGain = gain;
                startedAtCtx = when;
                startedAtOffset = offset;
                pauseOffset = offset;
                isPlaying = true;
                statusEl.textContent = `Piste ${index + 1} / ${tracks.length}`;
                updateTransportUi();
                startProgressLoop();
                scheduleFollowing(gen, index, when, buffer.duration - offset, gain);
                pruneDecoded(index);
            } catch (e) {
                console.error(e);
                if (gen !== playGeneration) return;
                isPlaying = false;
                statusEl.textContent = e.message || String(e);
                updateTransportUi();
                stopProgressLoop();
            }
        }

        function pauseWebAudio() {
            if (!isPlaying) return;
            pauseOffset = currentOffset();
            const now = audioCtx.currentTime;
            playGeneration++;
            if (transitionTimer) { clearTimeout(transitionTimer); transitionTimer = null; }
            if (cleanupTimer) { clearTimeout(cleanupTimer); cleanupTimer = null; }
            if (activeGain) {
                try {
                    activeGain.gain.cancelScheduledValues(now);
                    activeGain.gain.setValueAtTime(Math.max(activeGain.gain.value, 0.0001), now);
                    activeGain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
                } catch (_) {}
            }
            if (pendingNextSource || pendingNextGain) {
                killSourceGain(pendingNextSource, pendingNextGain);
                pendingNextSource = pendingNextGain = null;
            }
            const genAtPause = playGeneration;
            setTimeout(() => {
                if (playGeneration !== genAtPause) return;
                killSourceGain(activeSource, activeGain);
                killSourceGain(fadingOutSource, fadingOutGain);
                activeSource = activeGain = null;
                fadingOutSource = fadingOutGain = null;
            }, 25);
            isPlaying = false;
            statusEl.textContent = 'En pause';
            updateTransportUi();
            stopProgressLoop();
            updateProgressUi();
        }

        // ===================== Shared API =====================

        async function playTrack(index, offset = 0) {
            if (!ready) return;
            if (USE_HTML_ENGINE) return playTrackHtml(index, offset);
            return playTrackWebAudio(index, offset);
        }

        function pause() {
            if (USE_HTML_ENGINE) return pauseHtml();
            return pauseWebAudio();
        }

        async function togglePlayPause() {
            if (!ready) return;
            if (isPlaying) {
                pause();
                return;
            }
            if (USE_HTML_ENGINE && active.src && pauseOffset > 0 && Number.isFinite(active.duration)) {
                try {
                    active.currentTime = pauseOffset;
                    await active.play();
                    isPlaying = true;
                    statusEl.textContent = `Piste ${currentIndex + 1} / ${tracks.length}`;
                    updateTransportUi();
                    startProgressLoop();
                    preloadStandby(currentIndex + 1);
                    return;
                } catch (_) {}
            }
            await playTrack(currentIndex, pauseOffset);
        }

        async function playPrev() {
            const pos = currentOffset();
            if (pos > 3) {
                if (USE_HTML_ENGINE) await seekTo(0);
                else await playTrack(currentIndex, 0);
                return;
            }
            if (currentIndex <= 0) return;
            await playTrack(currentIndex - 1, 0);
        }

        async function playNext() {
            if (currentIndex >= tracks.length - 1) return;
            await playTrack(currentIndex + 1, 0);
        }

        async function seekTo(offset) {
            pauseOffset = offset;
            if (USE_HTML_ENGINE) {
                if (!active.src) {
                    updateProgressUi();
                    updateMediaSession();
                    return;
                }
                try { active.currentTime = offset; } catch (_) {}
                handoffArmed = false;
                if (isPlaying) {
                    try { await active.play(); } catch (_) {}
                }
                updateProgressUi();
                updateMediaSession();
                return;
            }
            if (isPlaying) await playTrack(currentIndex, offset);
            else {
                updateProgressUi();
                updateMediaSession();
            }
        }

        function onActiveEnded() {
            if (syncing || handoffArmed) return;
            if (currentIndex + 1 < tracks.length) {
                playTrack(currentIndex + 1, 0);
                return;
            }
            isPlaying = false;
            pauseOffset = 0;
            statusEl.textContent = "Fin de l'album.";
            updateTransportUi();
            stopProgressLoop();
        }

        if (USE_HTML_ENGINE) {
            audioA.addEventListener('ended', () => { if (active === audioA) onActiveEnded(); });
            audioB.addEventListener('ended', () => { if (active === audioB) onActiveEnded(); });
            audioA.addEventListener('pause', () => {
                if (!syncing && active === audioA && isPlaying) pause();
            });
            audioB.addEventListener('pause', () => {
                if (!syncing && active === audioB && isPlaying) pause();
            });
            audioA.addEventListener('play', () => {
                if (!syncing && active === audioA && !isPlaying && ready) togglePlayPause();
            });
            audioB.addEventListener('play', () => {
                if (!syncing && active === audioB && !isPlaying && ready) togglePlayPause();
            });
        }

        seekEl.addEventListener('pointerdown', () => { seeking = true; });
        seekEl.addEventListener('input', () => {
            seeking = true;
            const dur = currentDuration();
            if (dur > 0) timeCurrentEl.textContent = formatTime((Number(seekEl.value) / 1000) * dur);
        });
        seekEl.addEventListener('change', async () => {
            const dur = currentDuration();
            const offset = dur > 0 ? (Number(seekEl.value) / 1000) * dur : 0;
            seeking = false;
            await seekTo(offset);
        });

        function clearButtonFocus(btn) {
            const clear = () => { try { btn.blur(); } catch (_) {} };
            btn.addEventListener('pointerup', clear);
            btn.addEventListener('pointercancel', clear);
            btn.addEventListener('touchend', clear, { passive: true });
            btn.addEventListener('click', () => {
                clear();
                requestAnimationFrame(clear);
                setTimeout(clear, 50);
            });
        }

        btnPlayPause.addEventListener('click', () => togglePlayPause());
        btnPrev.addEventListener('click', () => playPrev());
        btnNext.addEventListener('click', () => playNext());
        [btnPlayPause, btnPrev, btnNext].forEach(clearButtonFocus);

        (async function init() {
            try {
                await loadTrackList();
                ready = true;
                setupMediaSessionHandlers();
                renderPlaylist();
                const mode = USE_HTML_ENGINE ? 'mobile (bandeau média)' : 'desktop (gapless)';
                statusEl.textContent = `${tracks.length} pistes — prêt · ${mode}`;
                btnPlayPause.disabled = false;
                btnPrev.disabled = currentIndex <= 0;
                btnNext.disabled = currentIndex >= tracks.length - 1;
                trackTitleEl.textContent = tracks[0].name;
                updateTransportUi();
            } catch (e) {
                console.error(e);
                statusEl.textContent = e.message || String(e);
            }
        })();
</script>
</body>
</html>
